# Decap CMS config. Contributor logins run through DecapBridge (PKCE auth).
backend:
  name: git-gateway
  repo: barriebramley-hub/bhs87-alumni-site
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b3894440-ebc3-4bae-9417-61f371b9e8d7/pkce
  auth_token_endpoint: /sites/b3894440-ebc3-4bae-9417-61f371b9e8d7/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://bhsalumni.co.za

publish_mode: editorial_workflow
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog posts
    label_singular: Post
    folder: src/content/blog
    create: true
    extension: md
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    sortable_fields: [date, title, category]
    fields:
      - { name: title, label: Title, widget: string, hint: "Title Case" }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: category, label: Category, widget: select, options: [Memories, Happenings, Profiles, Podcasts, Foundation, Notices] }
      - { name: excerpt, label: Excerpt, widget: text, hint: "1–2 sentences. Used on cards and as the standfirst." }
      - { name: author, label: Author, widget: string, default: Tan Lawensky }
      - { name: hero, label: Hero image, widget: image, required: false, hint: "If empty, a black block with the category name is shown." }
      - { name: podcastUrl, label: Podcast URL, widget: string, required: false, hint: "Podcasts posts only. The home page Podcasts list links here." }
      - { name: podcastHost, label: Podcast host / platform, widget: string, required: false, hint: "e.g. Apple Podcasts" }
      - { name: draft, label: Draft, widget: boolean, default: false, required: false }
      - { name: sample, label: Sample post (delete or replace), widget: boolean, default: false, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About page
        file: src/content/pages/about.md
        fields:
          - { name: title, label: Title, widget: hidden, default: About }
          - name: sections
            label: Sections
            widget: list
            fields:
              - { name: number, label: Number, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
